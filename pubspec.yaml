name: melody_flutter
description: Melody 音乐播放器（网易云 API，Flutter 重构版）
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  dio: ^5.7.0
  pointycastle: ^4.0.0
  crypto: ^3.0.6
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+3
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  dynamic_color: ^1.7.0
  just_audio: ^0.10.2
  audio_service: ^0.18.17
  audio_session: ^0.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
