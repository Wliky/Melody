##
## Melody — 版本目录（唯一事实来源）
##

[versions]
# ── 构建 ──────────────────────────────────────────────────────
agp = "9.4.1"
# Compose 编译器插件跟随 Kotlin 编译器版本（与 AGP 内置 Kotlin 保持一致）
composeCompiler = "2.4.20"
hilt = "2.60.1"

# ── AndroidX 基础 ─────────────────────────────────────────────
coreKtx = "1.17.0"
activityCompose = "1.13.0"
lifecycle = "2.9.0"

# ── UI ────────────────────────────────────────────────────────
composeBom = "2026.09.00"
# Haze：Compose 毛玻璃效果（2.0 起拆为 haze 核心 + haze-blur 模糊实现 + haze-materials 预设材料）
haze = "2.0.0"
# Coil 3：图片加载
coil = "3.6.3"
# Palette：封面取色（播放器局部莫奈配色）
palette = "1.0.0"

# ── 存储 ──────────────────────────────────────────────────────
datastore = "1.2.0"

# ── 网络 / 序列化 ─────────────────────────────────────────────
# OkHttp 主版本与 Coil 3.6 传递依赖对齐（5.x 稳定线）
okhttp = "5.1.0"
# JSON 序列化（kotlinx.serialization，插件版本跟随 Kotlin 编译器）
serializationJson = "1.9.0"
# ZXing core：二维码生成（纯 JVM，无摄像头权限需求）
zxing = "3.5.3"
# Hilt 的 Compose 集成（hiltViewModel()）
hiltNavigationCompose = "1.3.0"
# Media3：ExoPlayer + MediaSession（后台播放 / 通知栏）
media3 = "1.11.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }

haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
# 2.0 线的材料预设模块（1.x 的 haze-materials 已停止，被它替代）
haze-blur-materials = { module = "dev.chrisbanes.haze:haze-blur-materials", version.ref = "haze" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

androidx-palette = { module = "androidx.palette:palette-ktx", version.ref = "palette" }

datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
legacy-kapt = { id = "com.android.legacy-kapt", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "composeCompiler" }

[bundles]
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-foundation",
    "androidx-compose-material3",
    "androidx-compose-ui-tooling-preview",
]
